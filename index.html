<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LNAA Student Association</title>

  <!-- Tailwind CSS (CDN build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* --brand is set at runtime from content.json's theme.primaryColor.
       Tailwind's arbitrary-value classes like bg-[var(--brand)] read this
       live, so changing the color in the CMS updates the whole site. */
    :root { --brand: #1d4ed8; }

    .tab-btn.active {
      color: var(--brand);
      border-color: var(--brand);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- ===================== HEADER ===================== -->
  <header class="bg-[var(--brand)] text-white">
    <div class="max-w-5xl mx-auto px-4 py-8 text-center">
      <h1 id="site-title" class="text-3xl md:text-4xl font-bold tracking-tight">Loading…</h1>
      <p id="site-subtitle" class="mt-2 text-white/90"></p>
      <p class="mt-1 text-sm text-white/70">
        <span id="site-year"></span> · <span id="site-motto"></span>
      </p>
    </div>
  </header>

  <!-- ===================== TAB NAVIGATION ===================== -->
  <nav class="sticky top-0 bg-white border-b border-gray-200 shadow-sm z-10">
    <div class="max-w-5xl mx-auto px-4 flex gap-1 overflow-x-auto">
      <button class="tab-btn active whitespace-nowrap px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-[var(--brand)] transition-colors" data-tab="officers">
        Meet Your Officers
      </button>
      <button class="tab-btn whitespace-nowrap px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-[var(--brand)] transition-colors" data-tab="suggest">
        Suggest an Idea
      </button>
      <button class="tab-btn whitespace-nowrap px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-[var(--brand)] transition-colors" data-tab="calendar">
        Calendar
      </button>
      <button class="tab-btn whitespace-nowrap px-4 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-[var(--brand)] transition-colors" data-tab="photos">
        Photo Highlights
      </button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- ===================== TAB 1: MEET YOUR OFFICERS ===================== -->
    <section id="tab-officers" class="tab-panel active">
      <h2 class="text-2xl font-semibold mb-6">Meet Your Officers</h2>
      <div id="officers-container" class="space-y-10">
        <!-- JS fills this with one block per category, each containing a card grid -->
        <p class="text-gray-400">Loading officers…</p>
      </div>
    </section>

    <!-- ===================== TAB 2: SUGGEST AN IDEA ===================== -->
    <section id="tab-suggest" class="tab-panel">
      <h2 class="text-2xl font-semibold mb-6">Suggest an Idea</h2>

      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <!--
          ============================================================
          GOOGLE FORM PLACEHOLDER
          Paste your embedded Google Form <iframe> below, replacing
          this comment block. In Google Forms: Send → Embed <> → copy
          the <iframe> code and paste it here.

          Example:
          <iframe src="https://docs.google.com/forms/d/e/YOUR_FORM_ID/viewform?embedded=true"
                  width="100%" height="900" frameborder="0" marginheight="0" marginwidth="0"
                  class="rounded-lg">
            Loading…
          </iframe>
          ============================================================
        -->
        <div class="text-center text-gray-400 py-16 border-2 border-dashed border-gray-300 rounded-lg">
          Google Form will appear here once embedded.
        </div>
        <!-- END GOOGLE FORM PLACEHOLDER -->
      </div>
    </section>

    <!-- ===================== TAB 3: CALENDAR ===================== -->
    <section id="tab-calendar" class="tab-panel">
      <h2 class="text-2xl font-semibold mb-6">Calendar</h2>

      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <!--
          ============================================================
          GOOGLE CALENDAR PLACEHOLDER
          Paste your embedded Google Calendar <iframe> below, replacing
          this comment block. In Google Calendar: Settings → select your
          calendar → Integrate calendar → copy the "Embed code" and
          paste it here.

          Example:
          <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_CALENDAR_ID"
                  style="border:0" width="100%" height="600" frameborder="0"
                  scrolling="no" class="rounded-lg">
          </iframe>
          ============================================================
        -->
        <div class="text-center text-gray-400 py-16 border-2 border-dashed border-gray-300 rounded-lg">
          Google Calendar will appear here once embedded.
        </div>
        <!-- END GOOGLE CALENDAR PLACEHOLDER -->
      </div>
    </section>

    <!-- ===================== TAB 4: PHOTO HIGHLIGHTS ===================== -->
    <section id="tab-photos" class="tab-panel">
      <h2 class="text-2xl font-semibold mb-6">Photo Highlights</h2>
      <div id="gallery-container" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <p class="text-gray-400 col-span-full">Loading photos…</p>
      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-gray-400 py-8">
    LNAA Student Association · Built with ❤️ for every student
  </footer>

  <script>
    // ===================== TAB SWITCHING =====================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ===================== CONTENT LOADING =====================
    function applyTheme(theme) {
      if (theme && theme.primaryColor) {
        document.documentElement.style.setProperty('--brand', theme.primaryColor);
      }
    }

    function renderGeneral(general) {
      if (!general) return;
      document.getElementById('site-title').textContent = general.title || '';
      document.getElementById('site-subtitle').textContent = general.subtitle || '';
      document.getElementById('site-year').textContent = general.year || '';
      document.getElementById('site-motto').textContent = general.motto || '';
    }

    function officerCardHTML(o) {
      const hasPhoto = o.photo && o.photo.trim() !== '';
      const avatar = hasPhoto
        ? `<img src="${o.photo}" alt="${o.name}" class="w-24 h-24 rounded-full object-cover mx-auto">`
        : `<div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center mx-auto text-gray-400 text-2xl">?</div>`;
      return `
        <div class="bg-white rounded-xl border border-gray-200 p-5 text-center shadow-sm">
          ${avatar}
          <p class="mt-3 font-semibold">${o.name || 'To Be Announced'}</p>
          <p class="text-sm text-[var(--brand)]">${o.role || ''}</p>
        </div>`;
    }

    function renderOfficers(officers) {
      const container = document.getElementById('officers-container');
      if (!officers || !officers.length) {
        container.innerHTML = '<p class="text-gray-400">No officers added yet.</p>';
        return;
      }
      // Group officers by category, preserving first-seen order
      const categories = [];
      const byCategory = {};
      officers.forEach(o => {
        const cat = o.category || 'Officers';
        if (!byCategory[cat]) { byCategory[cat] = []; categories.push(cat); }
        byCategory[cat].push(o);
      });

      container.innerHTML = categories.map(cat => `
        <div>
          <p class="text-xs uppercase tracking-wider text-gray-400 mb-4">${cat}</p>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${byCategory[cat].map(officerCardHTML).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderGallery(gallery) {
      const container = document.getElementById('gallery-container');
      if (!gallery || !gallery.length) {
        container.innerHTML = '<p class="text-gray-400 col-span-full">No photos added yet.</p>';
        return;
      }
      container.innerHTML = gallery.map(item => `
        <figure class="relative rounded-lg overflow-hidden bg-gray-100 aspect-square">
          <img src="${item.src}" alt="${item.title || ''}" class="w-full h-full object-cover">
          <figcaption class="absolute inset-x-0 bottom-0 bg-black/60 text-white text-xs px-2 py-1">
            <span class="font-medium">${item.title || ''}</span>
            ${item.tag ? `<span class="ml-1 opacity-75">· ${item.tag}</span>` : ''}
          </figcaption>
        </figure>
      `).join('');
    }

    async function loadContent() {
      try {
        const res = await fetch('content.json', { cache: 'no-store' });
        const data = await res.json();
        applyTheme(data.theme);
        renderGeneral(data.general);
        renderOfficers(data.officers);
        renderGallery(data.gallery);
      } catch (err) {
        console.error('Could not load content.json', err);
      }
    }

    loadContent();
  </script>
</body>
</html>
